# Llama.cpp 引擎包定义
# 说明：
#   - 这是引擎自身的 Python 包元信息
#   - 让 `python -m engines.llama_cpp_9cdb76f8.server` 能正确解析包结构
#   - 引擎依赖由 envs/llm-llama-cpp/ 提供，这里不重复声明

[project]
name = "llama-cpp-engine"
version = "1.0.0"
description = "AIReliable Llama.cpp 引擎（GGUF 模型通用运行引擎）"
requires-python = ">=3.10,<3.12"

# 引擎运行依赖在 envs/llm-llama-cpp/pyproject.toml 中声明
# 这里不重复声明，避免双重锁定版本
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engines"]

# ===== 测试配置 =====
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
