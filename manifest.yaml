      url: https://huggingface.co/bartowski/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q6_K_L.gguf
      mirror_url: https://hf-mirror.com/bartowski/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q6_K_L.gguf
    description: Qwen3.8-27B Q6_K_L 量化（约 24GB，bartowski 公开仓库免 token）
  - id: mmproj-qwen3.8-27b-f16-gguf
